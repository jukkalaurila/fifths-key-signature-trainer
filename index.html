<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f6f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fifths">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="description" content="Practice all 15 major and 15 minor key signatures with adaptive spaced repetition. Offline and private.">
<title>Fifths — Key Signature Trainer</title>
<style>
:root { --bg:#f8f6f1; --paper:#fffefa; --ink:#1d302d; --muted:#66736f; --teal:#116455; --teal-soft:#e4f2ed; --line:#dfE4dd; --amber:#c98a3b; --amber-soft:#fbefd9; --red:#af4c44; --red-soft:#fff0ed; --blue:#56799d; --blue-soft:#eaf0f8; --shadow:0 9px 30px rgba(28,52,44,.055); }
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; min-width:310px; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
button,input,select { font:inherit; }
button { cursor:pointer; -webkit-tap-highlight-color:transparent; }
button:focus-visible,input:focus-visible,select:focus-visible { outline:3px solid #64b19b;outline-offset:3px; }
[hidden] { display:none!important; }
.wrap { max-width:1060px; padding:0 24px; margin:auto; }
header { border-bottom:1px solid var(--line); background:rgba(255,254,250,.8); }
.header-inner { display:flex; align-items:center; justify-content:space-between; padding:18px 0; gap:14px; }
.brand { display:flex;align-items:center;gap:13px;text-decoration:none;color:var(--ink); }
.logomark { display:grid; place-items:center; width:42px; height:42px; border-radius:13px; background:var(--ink); color:#faf6ec; font:27px Georgia,serif; }
.brandname { font:bold 22px Georgia,serif; letter-spacing:-.8px; line-height:1; }
.brandtag { font-size:10px;letter-spacing:1.7px;text-transform:uppercase;color:var(--muted);margin-top:5px; }
.local-pill { background:var(--teal-soft); color:var(--teal); border:1px solid #d1e8dc; border-radius:99px; font-size:12px; font-weight:650; padding:7px 12px; white-space:nowrap; }
.local-pill::before { content:"●";margin-right:7px;font-size:9px; }
.nav { display:flex;gap:7px; padding:16px 0 19px; }
.nav button { border:1px solid transparent; background:transparent; color:var(--muted); padding:10px 17px; border-radius:11px; font-weight:650; }
.nav button:hover {background:#eeeFe9;}
.nav button[aria-selected=true] {background:var(--ink);color:white;}
main { padding-bottom:62px; }
.view { padding-top:19px; }
.kicker { text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:800;color:var(--teal); margin:0 0 10px; }
h1,h2,h3,p { margin-top:0; }
h1 {font:normal clamp(31px,5vw,47px)/1.12 Georgia,serif; letter-spacing:-1.5px; margin-bottom:14px;}
h2 {font:normal 27px/1.2 Georgia,serif; letter-spacing:-.6px; margin-bottom:14px;}
h3 {font:normal 20px Georgia,serif; margin-bottom:10px; }
.lead {color:var(--muted); font-size:16px; line-height:1.7; max-width:550px; margin:0 0 25px;}
.hero { display:grid;grid-template-columns:1.35fr .85fr;gap:20px; margin-top:13px; }
.hero-left {background:var(--paper);border:1px solid var(--line);border-radius:23px;padding:30px 30px 27px;box-shadow:var(--shadow); }
.hero-side {position:relative; background:#e8eee8; border:1px solid #d9e4da; border-radius:23px; padding:28px 27px;overflow:hidden; }
.hero-side::after {content:"♯"; position:absolute; right:-7px;bottom:-105px;font:250px Georgia,serif;color:rgba(19,83,69,.05); transform:rotate(-13deg);pointer-events:none;}
.hero-side h2 {position:relative;font-size:24px;max-width:240px;margin-bottom:20px;}
.how {position:relative;display:flex;gap:12px;margin-bottom:20px; max-width:260px;}
.how-icon {display:grid;place-items:center;width:29px;height:29px;border-radius:9px;background:#f8fbf5;color:var(--teal);font-weight:800;flex-shrink:0;}
.how b {display:block;font-size:13px;margin-bottom:2px;}
.how span {color:#63716a;font-size:12.5px;line-height:1.5;display:block;}
.stats {display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0 25px;}
.stat {background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:19px 17px;}
.stat-n {font:normal 34px/1.1 Georgia,serif;margin-bottom:6px;letter-spacing:-.9px;font-variant-numeric:tabular-nums;}
.stat-l {text-transform:uppercase;font-size:10px;letter-spacing:1.25px;color:var(--muted);font-weight:800;}
.controls {display:grid;grid-template-columns:repeat(2,minmax(0,1fr)); gap:15px;margin:21px 0;}
.field > label {display:block;font-size:12px;text-transform:uppercase;letter-spacing:1.15px;color:var(--muted);font-weight:800;margin-bottom:8px;}
.field select {width:100%;padding:12px 36px 12px 12px;border:1px solid #d5ddd5;border-radius:11px;color:var(--ink);background:var(--paper);}
.btn {border:1px solid transparent;border-radius:12px;padding:12px 18px;font-weight:750;transition:background .15s,transform .12s;display:inline-flex;gap:9px;align-items:center;justify-content:center;white-space:nowrap;}
.btn:active {transform:scale(.985);}
.btn-primary {color:white;background:var(--teal);}
.btn-primary:hover {background:#0c4f43;}
.btn-dark {color:white;background:var(--ink);}
.btn-secondary {border-color:#cdd9d0;background:var(--paper);color:var(--ink);}
.btn-secondary:hover {background:#edf4ed;}
.btn-text {border-color:transparent;background:transparent;color:var(--teal);padding-left:0;}
.btn-danger {background:var(--red-soft);color:var(--red);border-color:#f3d5d1;}
.btn[disabled] {opacity:.4;cursor:default;}
.cta-row {display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.note {font-size:12px;color:var(--muted);margin:14px 0 0;line-height:1.5;}
.section-head {display:flex;justify-content:space-between;align-items:end;gap:12px;margin-top:10px;margin-bottom:14px;}
.section-head h2 {margin-bottom:2px;}
.section-head p {margin:0;color:var(--muted);font-size:13px;}
.text-button {border:0;padding:8px 0;background:transparent;color:var(--teal);font-weight:700;}
.legend {display:flex;gap:15px;flex-wrap:wrap;font-size:12px;color:var(--muted);}
.dot {width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px;}
.dot-new {background:#bbc5c0;}.dot-learn {background:var(--amber);}.dot-build {background:var(--blue);}.dot-solid {background:var(--teal);}
.progress-line {height:11px;border-radius:99px;background:#e5e8e1;overflow:hidden;display:flex;margin:20px 0 13px;}
.progress-line div {height:100%;transition:width .2s;}
.summary-blurb {display:flex;justify-content:space-between;gap:15px;color:var(--muted);font-size:13px;margin-bottom:16px;}
.panel {border:1px solid var(--line);border-radius:20px;background:var(--paper);padding:22px;box-shadow:var(--shadow);}
.card-grid {display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.key-card {text-align:left;border:1px solid var(--line);background:var(--paper);padding:15px;border-radius:13px;display:flex;gap:12px;align-items:center;min-width:0;}
.key-card:hover {border-color:#93c7b6; background:#fbfffc;}
.key-ind {width:9px;height:40px;border-radius:7px;flex-shrink:0;}
.key-card strong {font-size:15px;font-weight:750;display:block;}
.key-card small {display:block;color:var(--muted);font-size:12px;margin-top:2px;}
.key-card em {margin-left:auto;color:var(--muted);font-size:12px;font-style:normal;text-align:right;white-space:nowrap;}
.library-grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
.library-card {border:1px solid var(--line);border-radius:16px;background:var(--paper);padding:18px;}
.library-card .names {display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:9px;}
.library-card strong {font-size:16px;}.library-card small {font-size:12px;color:var(--muted);}
.library-card svg {max-width:100%;}
.library-card .foot {display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:3px;}
.topic-line {margin:15px 0 18px;color:var(--muted);font-size:14px;max-width:690px;}
.topic-line strong {color:var(--ink);}
.tools-bar {display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:20px;}
.tools-bar select {background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:9px 12px;}
.tools-bar .spacer {flex:1;}
.quiz-shell {max-width:775px;margin:10px auto 0;}
.quiz-top {display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:13px;font-weight:750;margin-bottom:13px;}
.quiz-track {height:6px;background:#e6e9e3;border-radius:20px;overflow:hidden;margin-bottom:26px;}
.quiz-track >div {height:100%;background:var(--teal);transition:width .2s;border-radius:20px;}
.question-card {background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:26px 28px 24px;box-shadow:var(--shadow);}
.question-type {font-size:11px;letter-spacing:1.5px;font-weight:800;text-transform:uppercase;color:var(--teal);margin-bottom:10px;}
.question-card h2 {font-size:clamp(25px,4.5vw,32px);margin:0 0 22px;}
.signature-large {background:#f8faf6;border:1px solid #e9ede7;border-radius:16px;max-width:550px;margin:0 auto 22px;min-height:165px;display:flex;align-items:center;justify-content:center;padding:9px;}
.signature-large svg {display:block;width:100%;max-width:490px;}
.question-sub {text-align:center;font-size:12px;color:var(--muted);margin-top:-8px;margin-bottom:20px;}
.options {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;}
.choice {display:flex;align-items:center;justify-content:space-between;gap:11px;text-align:left;min-height:68px;background:#fffefa;border:1.5px solid #dbe3db;color:var(--ink);border-radius:13px;padding:15px 15px;font-weight:750;transition:background .12s,border-color .12s;min-width:0;}
.choice:hover:not(:disabled) {background:#f3faf5;border-color:#a6cabc;}
.choice:disabled {cursor:default;}
.choice .choice-label {font-size:clamp(14px,2.5vw,17px);}
.choice .choice-kbd {color:#a0ada6;font-size:11px;font-weight:750;border:1px solid #e2e7df;border-radius:6px;padding:1px 6px;}
.choice.correct {background:#eaf7ef;border-color:#56aa84;color:#0d633f;}
.choice.wrong {background:var(--red-soft);border-color:#df8c83;color:#a13e36;}
.choice.dimmed {opacity:.52;}
.choice-write {display:block;text-align:center;padding:8px 8px 12px;min-height:144px;}
.choice-write svg {width:100%; max-width:220px;height:92px;display:block;margin:auto;}
.choice-write .choice-label {font-size:12px;color:var(--muted);}
.answer-box {border-radius:14px;margin-top:20px;padding:19px;}
.answer-box.good {background:var(--teal-soft);color:#145645;}
.answer-box.bad {background:var(--red-soft);color:#873e39;}
.answer-box h3 {font:bold 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0 0 6px;}
.answer-box p {margin:0 0 10px;font-size:14px;line-height:1.55;}
.answer-box .mnemonic {font-size:12px;opacity:.88;margin-bottom:0;}
.rating {display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:19px 0 12px;}
.rating-label {color:var(--muted);font-size:12px;font-weight:700;margin-right:auto;}
.rate {background:var(--paper);color:var(--muted);border:1px solid var(--line);padding:8px 13px;border-radius:9px;font-weight:700;font-size:12px;}
.rate[aria-pressed=true] {background:var(--ink);border-color:var(--ink);color:white;}
.answer-advance {display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding:11px 13px;background:#f4f8f3;border:1px solid #dbe8da;border-radius:13px;}
.answer-advance-result {font-size:14px;font-weight:800;white-space:nowrap;}
.answer-advance-result.good {color:var(--teal);}
.answer-advance-result.bad {color:var(--red);}
.answer-advance .btn {min-height:45px;scroll-margin-block:16px;}
.quiz-footer {display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:18px;}
.quiz-footer .note {margin:0;}
.results {max-width:690px;margin:24px auto;text-align:center;}
.results .big-number {font:60px Georgia,serif;color:var(--teal);margin:7px 0 0;}
.results .item {display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--line);text-align:left;gap:10px;font-size:13px;}
.results .item b {color:var(--ink);}
.results .item span {color:var(--muted);}
.breakdown {margin:20px auto;max-width:460px;}
.empty {padding:45px 20px;text-align:center;border:1px dashed #baccc1;border-radius:16px;background:#fcfdf9;}
.empty h3 {margin-bottom:7px;}
.empty p {color:var(--muted);}
.details {max-width:630px;margin:0 auto;}
.details svg {width:100%;max-width:440px;display:block;margin:15px auto;}
.detail-meta {display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:19px 0 15px;}
.detail-meta>div {border-radius:12px;background:#f1f4ee;text-align:center;padding:14px 7px;}
.detail-meta strong {font:23px Georgia,serif;display:block;}
.detail-meta small {display:block;color:var(--muted);font-size:11px;margin-top:4px;}
footer {color:#7b8780;font-size:12px;text-align:center;padding:20px 24px 31px;border-top:1px solid var(--line);}
.dialog-back {position:fixed;inset:0;z-index:10;background:#12292199;display:grid;place-items:center;padding:18px;}
.dialog {background:var(--paper);border-radius:20px;padding:23px;box-shadow:0 30px 80px #0003;max-width:535px;width:100%;max-height:88vh;overflow:auto;}
.dialog-head {display:flex;justify-content:space-between;align-items:center;gap:12px;}
.dialog-head h2 {margin:0;}.close {background:transparent;border:0;font-size:27px;color:var(--muted);padding:0 6px;}
@media(max-width:750px) { .hero{grid-template-columns:1fr;} .hero-side{display:none;} .stats{grid-template-columns:repeat(2,1fr);} .hero-left{padding:25px 22px;} .wrap{padding:0 16px;} .library-grid{grid-template-columns:1fr;} .card-grid{grid-template-columns:1fr;} .section-head{align-items:start;} }
@media(max-width:480px) { .header-inner{padding:12px 0;} .local-pill{font-size:10px;padding:6px 9px;} .brandname{font-size:20px;} .logomark{width:36px;height:36px;} .nav{padding:10px 0 13px;} .nav button{flex:1;padding:10px 9px;} .controls{grid-template-columns:1fr;gap:10px;} .stats{gap:10px;} .stat{padding:14px 13px;} .stat-n{font-size:29px;} .question-card{padding:20px 15px;} .options{gap:9px;} .choice{padding:11px;min-height:61px;} .choice-write{padding:5px 3px;min-height:113px;} .choice-write svg{height:72px;} .answer-advance{padding:9px 11px;} .answer-advance .btn{padding:11px 13px;font-size:14px;} .rating-label{width:100%;}.quiz-footer{align-items:stretch;}.quiz-footer .btn{width:100%;} .quiz-footer .note{display:none;} .signature-large{min-height:135px;} .summary-blurb{flex-direction:column;gap:3px;} }
@media(prefers-reduced-motion:reduce) { *,*:before,*:after {animation:none!important;transition:none!important;} }
</style>
</head>
<body>
<header><div class="wrap header-inner"><a class="brand" href="#" id="homeLink" aria-label="Fifths home"><span class="logomark">♮</span><div><div class="brandname">fifths<span style="color:var(--teal)">.</span></div><div class="brandtag">KEY SIGNATURE STUDIO</div></div></a><span class="local-pill">Saved on this device</span></div></header>
<div class="wrap"><nav class="nav" aria-label="Main navigation"><button data-view="study" aria-selected="true">Practice</button><button data-view="progress" aria-selected="false">Progress</button><button data-view="library" aria-selected="false">Key library</button></nav><main id="app" aria-live="polite"></main></div>
<footer>30 spellings · 15 major + 15 minor · Treble clef · Works offline · No account or tracking</footer>
<input id="importFile" type="file" accept="application/json,.json" hidden>
<div id="modalRoot" hidden></div>
<script>
(()=>{'use strict';
const SIGS=[
 {n:-7,maj:'C♭',min:'A♭'}, {n:-6,maj:'G♭',min:'E♭'}, {n:-5,maj:'D♭',min:'B♭'},
 {n:-4,maj:'A♭',min:'F'}, {n:-3,maj:'E♭',min:'C'}, {n:-2,maj:'B♭',min:'G'},
 {n:-1,maj:'F',min:'D'}, {n:0,maj:'C',min:'A'}, {n:1,maj:'G',min:'E'},
 {n:2,maj:'D',min:'B'}, {n:3,maj:'A',min:'F♯'}, {n:4,maj:'E',min:'C♯'},
 {n:5,maj:'B',min:'G♯'}, {n:6,maj:'F♯',min:'D♯'}, {n:7,maj:'C♯',min:'A♯'}
];
const CARDS=SIGS.flatMap(s=>['major','minor'].map(mode=>({id:mode+'-'+s.n,n:s.n,mode,name:mode==='major'?s.maj:s.min,relative:mode==='major'?s.min:s.maj})));
const STORAGE='fifths-key-trainer-v1';
const MS_DAY=86400000;
const blank=()=>({version:1,cards:{},settings:{mode:'both',drill:'mixed',newPerDay:5,rare:true},newByDay:{}});
function load(){try{const p=JSON.parse(localStorage.getItem(STORAGE)||'null'); if(!p||typeof p!=='object'||!p.cards||!p.settings)return blank();return {version:1,cards:p.cards,settings:{...blank().settings,...p.settings},newByDay:p.newByDay||{}};}catch{return blank();}}
let data=load(),view='study',session=null,modal=null;
const app=document.getElementById('app');
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(data));}catch{document.querySelector('.local-pill').textContent='Save blocked — export a backup';}}
const num=(n)=>Math.round(n).toLocaleString('en-US');
const label=(c)=>c.name+' '+c.mode;
const sigLabel=n=>n===0?'No sharps or flats':Math.abs(n)+' '+(n>0?'sharp':'flat')+(Math.abs(n)===1?'':'s');
const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');};
const record=id=>data.cards[id]||{seen:0,correct:0,wrong:0,reps:0,ease:2.5,interval:0,due:0,history:[],lapses:0};
const status=r=>!r.seen?'new':r.interval>=21?'solid':r.interval>=7?'build':'learn';
const statusLabel=s=>({new:'Not studied',learn:'Learning',build:'Developing',solid:'Solid'})[s];
const accuracy=r=>r.seen?Math.round(100*r.correct/r.seen):null;
const filtered=()=>CARDS.filter(c=>(data.settings.mode==='both'||c.mode===data.settings.mode)&&(data.settings.rare||Math.abs(c.n)<6));
const todayNew=()=>data.newByDay[today()]||0;
const isDue=r=>r.seen>0&&(!r.due||r.due<=Date.now());
function humanDue(r){if(!r.seen)return 'New';const ms=r.due-Date.now(); if(ms<=0)return 'Due now';if(ms<3600000)return 'In '+Math.max(1,Math.ceil(ms/60000))+' min';if(ms<MS_DAY)return 'In '+Math.ceil(ms/3600000)+' hr';if(ms<2*MS_DAY)return 'Tomorrow';return 'In '+Math.ceil(ms/MS_DAY)+' days';}
function dueItems(){return filtered().filter(c=>isDue(record(c.id)));}
function newItems(){return filtered().filter(c=>!record(c.id).seen);}
function availableCount(){return dueItems().length+Math.min(newItems().length,Math.max(0,Number(data.settings.newPerDay)-todayNew()));}
const escapeHTML=s=>String(s).replace(/[&<>\"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
// Self-contained, scalable treble-staff engravings: accidental positions follow conventional key-signature notation.
function staff(n,mini=false){
 const W=mini?270:500,H=mini?104:162, scale=mini?.64:1,ox=mini?34:45,oy=mini?5:14;
 const y=p=>({E4:108,F4:100,G4:92,A4:84,B4:76,C5:68,D5:60,E5:52,F5:44,G5:36})[p];
 const order=n>0?['F5','C5','G5','D5','A4','E5','B4']:['B4','E5','A4','D5','G4','C5','F4'];
 const xStart=mini?94:129,dx=mini?25:35;
 let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Treble clef, ${sigLabel(n)}">`;
 s+=`<g transform="translate(${ox} ${oy}) scale(${scale})">`;
 for(let i=0;i<5;i++){let yy=44+i*16;s+=`<path d="M 0 ${yy} H ${mini?380:410}" stroke="#72857c" stroke-width="1.1"/>`;}
 s+=`<text x="5" y="124" font-family="'Apple Symbols','Noto Music','DejaVu Sans',serif" font-size="86" fill="#243c35">𝄞</text>`;
 s+='</g>';
 if(n!==0){for(let i=0;i<Math.abs(n);i++){
   // Sign glyphs drawn as vector paths rather than font-dependent symbols.
   const x=xStart+i*dx, yy=oy+scale*y(order[i]);
   if(n>0){const sc=mini?.8:1;
     s+=`<g transform="translate(${x} ${yy}) scale(${sc})" stroke="#214338" stroke-linecap="round" fill="none"><path d="M -5 -20 L -8 20 M 6 -22 L 3 18" stroke-width="2.8"/><path d="M -14 -6 L 13 -11 L 12 -4 L -15 1 Z M -14 6 L 13 1 L 12 8 L -15 13 Z" stroke="none" fill="#214338"/></g>`;
   }else {const sc=mini?.83:1;
     s+=`<g transform="translate(${x} ${yy}) scale(${sc})" stroke="#214338" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M -6 -30 L -6 13 Q -1 3 6 4 Q 15 6 9 15 Q 4 22 -6 24"/></g>`;
   }
 }}else if(!mini){s+='<text x="258" y="102" text-anchor="middle" font-size="14" fill="#718078">no accidentals</text>';}
 s+='</svg>';return s;
}

 const due=possible.filter(c=>isDue(record(c.id))&&!already.includes(c.id));const fresh=possible.filter(c=>!record(c.id).seen&&!already.includes(c.id));

 else if(due.length)pool=due;

function distractors(target,mode){const all=SIGS.map(s=>({name:s[mode==='major'?'maj':'min'],n:s.n}));const correct=all.find(x=>x.n===target.n);const nearby=all.filter(x=>x.n!==target.n).sort((a,b)=>Math.abs(a.n-target.n)-Math.abs(b.n-target.n));const first=nearby.slice(0,7);

}
function sigDistractors(target){const candidates=SIGS.filter(s=>s.n!==target.n).sort((a,b)=>Math.abs(a.n-target.n)-Math.abs(b.n-target.n));const neighbors=candidates.slice(0,Math.min(6,candidates.length));const pool=[...neighbors.sort(()=>Math.random()-.5),...candidates.slice(6).sort(()=>Math.random()-.5)];return [SIGS.find(s=>s.n===target.n),...pool.slice(0,3)].sort(()=>Math.random()-.5);}

 if(obj.newByDay&&typeof obj.newByDay==='object'){for(const [k,v] of Object.entries(obj.newByDay)){if(/^\d{4}-\d\d-\d\d$/.test(k)&&Number.isFinite(v))clean.newByDay[k]=Math.max(0,v);}}

function wireActions(){document.querySelectorAll('[data-action]').forEach(el=>{const a=el.dataset.action;const handlers={start:()=>start(availableCount()===0),free:()=>start(true),next:commitAndNext,finish:()=>{if(session?.graded){const c=session.current,ok=session.selected===session.question.answer;const r=applyGrade(c,session.grade,ok);session.logs.push({name:label(c),correct:ok,grade:session.grade,interval:r.interval});}endSession();},home:()=>switchView('study'),export:exportData,import:requestImport,closeModal,reset:()=>{if(confirm('Permanently erase all key-signature progress stored in this browser? Export a backup first if you want to keep it.')){data=blank();save();render();}}};if(handlers[a])el.onclick=handlers[a];});}
function navUpdate(){document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.view===view)));}
function switchView(v){if(session&&session.graded){const c=session.current,ok=session.selected===session.question.answer;const r=applyGrade(c,session.grade,ok);session.logs.push({name:label(c),correct:ok,grade:session.grade,interval:r.interval});}session=null;view=v;navUpdate();render();window.scrollTo({top:0,behavior:'instant'});}
function render(){if(session){renderQuiz();return;}if(view==='study')home();else if(view==='progress')progress();else library();}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>switchView(b.dataset.view));document.getElementById('homeLink').onclick=e=>{e.preventDefault();switchView('study');};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){closeModal();return;}if(modal||!session)return;if(e.target.matches('input,select,textarea'))return;
 if(!session.graded&&['1','2','3','4'].includes(e.key)){const choice=session.question.choices[Number(e.key)-1];if(choice){e.preventDefault();submit(choice.value);}}
 else if(session.graded&&e.key==='Enter'){e.preventDefault();commitAndNext();}
 else if(session.graded&&['a','h','g','e'].includes(e.key.toLowerCase())){const grade={a:1,h:3,g:4,e:5}[e.key.toLowerCase()];if(session.selected===session.question.answer||grade===1){session.grade=grade;renderQuiz();}}
});
render();
if ('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')) {
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
})();
